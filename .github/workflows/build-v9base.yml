name: Build v9 Dual-Model Base Image (DA3 + Difix3D+ + gsplat)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/Dockerfile.v9base"
      - ".github/workflows/build-v9base.yml"

concurrency:
  group: build-v9base
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-v9base:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner (~30 GB)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push v9base image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile.v9base
          push: true
          tags: |
            ghcr.io/coskunerberke/mobilya-ar-worker:v9base
